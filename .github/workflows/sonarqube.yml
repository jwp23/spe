name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sonarqube:
    # Dependabot runs don't receive Actions secrets, so SONAR_TOKEN is empty and
    # the scan can't authenticate; skip — dependency bumps carry no analyzable code.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install system utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fontconfig

      - name: Generate code coverage
        run: |
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo llvm-cov --lcov --output-path lcov.info -- --include-ignored

      # Pinned by version tag rather than SHA: a 40-hex SHA next to "sonarqube"
      # trips Semgrep's generic SonarQube-token detector. Dependabot tracks the tag.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

