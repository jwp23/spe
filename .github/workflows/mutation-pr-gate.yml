name: Mutation testing (PR gate)

# A separate workflow file, not a job in ci.yml: this keeps the gate
# structurally parallel to ci.yml's jobs rather than sequenced after them
# (docs/designs/mutation-testing.md, "Layer 1 — PR gate").
#
# Deliberately no workflow-level `paths:` filter. A required check that a
# `paths:` filter excludes never runs at all, so GitHub reports no status for
# it and the PR is blocked on a permanently "pending" check. Instead, an
# in-job guard step (below) exits quickly when nothing in scope changed, and
# `mutation-gate` (the job branch protection should point at) always runs and
# reports success on that fast path, never a missing status.

on:
  pull_request:
    branches: [main]

permissions: {}

env:
  # Pinned to the version the 2026-08-14 spike measured
  # (docs/spikes/2026-08-14-cargo-mutants/results.md) and the local toolchain
  # runs against, so the PR gate's mutant counts and timing stay comparable
  # to that baseline instead of drifting with upstream cargo-mutants releases.
  CARGO_MUTANTS_VERSION: "27.1.0"

jobs:
  # Git-only: decides whether the PR's diff touches mutation-testing scope,
  # and if so, a rough shard count from diff size. Deliberately does not
  # install a toolchain or cargo-mutants — that cost is paid exactly once,
  # in the mutate job below, instead of once here (just to list mutants) and
  # again there (to actually run them). A real mutant count via
  # `cargo mutants --list --in-diff` would be more accurate than the line-count
  # proxy below, but paying a full toolchain install + cache restore + cargo
  # install here just to get that number would serialize ahead of the
  # (already toolchain-installing) mutate job for no wall-clock benefit.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      in-scope: ${{ steps.guard.outputs.in-scope }}
      base-sha: ${{ steps.guard.outputs.base-sha }}
      shards: ${{ steps.guard.outputs.shards }}
      shard-matrix: ${{ steps.guard.outputs.shard-matrix }}
    steps:
      # fetch-depth: 0 so the merge base of the PR's base branch and HEAD is
      # available locally for the diff below (a shallow clone only has HEAD).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the mutation-scope filter
        run: ./tests/mutation_scope_filter_test.sh

      - name: Guard - is anything in mutation-testing scope changed?
        id: guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          echo "base-sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

          # Always emit valid values for every output below, even on the
          # fast-exit paths, so a downstream fromJSON(needs.scope.outputs.*)
          # never sees an empty string.
          IN_SCOPE="false"
          SHARDS=0
          SHARD_MATRIX="[]"

          emit_outputs() {
            echo "in-scope=${IN_SCOPE}" >> "$GITHUB_OUTPUT"
            echo "shards=${SHARDS}" >> "$GITHUB_OUTPUT"
            echo "shard-matrix=${SHARD_MATRIX}" >> "$GITHUB_OUTPUT"
          }

          # No `|| true`: a git failure here (an unreachable base SHA, a
          # corrupt ref) must fail the job loudly, not be read as "nothing
          # changed" — that's the exact silent-pass direction
          # scripts/mutation-scope-filter.sh's parse failure below also
          # refuses. Only a genuinely empty diff is allowed to reach the
          # fast path.
          CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD")

          if [ -z "$CHANGED" ]; then
            echo "No files changed against ${BASE_SHA} — nothing in mutation-testing scope."
            emit_outputs
            exit 0
          fi

          # scripts/mutation-scope-filter.sh is the single definition of
          # "in scope": it drops non-.rs files and reads
          # .cargo/mutants.toml's exclude_globs itself, so the scope
          # decision lives in one tested place
          # (tests/mutation_scope_filter_test.sh), not duplicated here.
          IN_SCOPE_FILES=$(printf '%s\n' "$CHANGED" | ./scripts/mutation-scope-filter.sh .cargo/mutants.toml)

          if [ -z "$IN_SCOPE_FILES" ]; then
            echo "No changed files are in mutation-testing scope."
            emit_outputs
            exit 0
          fi

          echo "In scope:"
          printf '%s\n' "$IN_SCOPE_FILES"

          IN_SCOPE="true"

          # Cheap proxy for how much work this diff is, without a toolchain:
          # total changed lines across in-scope files. Coarser than a real
          # mutant count, but git-only. The 200-line cut point is a judgment
          # call with no measured data behind it yet (same caveat as any
          # threshold chosen before the gate has run against real PRs).
          CHANGED_LINES=0
          while IFS=$'\t' read -r added removed path; do
            [ -z "$path" ] && continue
            if printf '%s\n' "$IN_SCOPE_FILES" | grep -Fxq -- "$path"; then
              [ "$added" = "-" ] && added=0
              [ "$removed" = "-" ] && removed=0
              CHANGED_LINES=$((CHANGED_LINES + added + removed))
            fi
          done < <(git diff --numstat "${BASE_SHA}...HEAD" -- '*.rs')

          echo "In-scope changed lines: $CHANGED_LINES"

          if [ "$CHANGED_LINES" -gt 200 ]; then
            SHARDS=4
          else
            SHARDS=1
          fi

          # cargo-mutants' --shard k/n is 0-based (k must be < n; `--shard
          # 1/1` errors "shard k must be less than n" — confirmed against
          # the installed 27.1.0 binary). seq starts at 0, not 1.
          SHARD_MATRIX=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -sc .)

          emit_outputs

  mutate:
    needs: scope
    if: needs.scope.outputs.in-scope == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # --include-ignored (below) pulls in the #[ignore]d tests that exercise
      # these system utilities, so the mutation run needs them installed the
      # same way ci.yml's check job does.
      - name: Install system utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fontconfig

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked

      - name: Run cargo-mutants over the PR diff
        id: run
        env:
          BASE_SHA: ${{ needs.scope.outputs.base-sha }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.scope.outputs.shards }}
          # cargo-mutants copies the source tree plus a private target/ per
          # job; on a tmpfs /tmp a parallel run eats RAM-backed storage
          # toward OOM (spike finding). runner.temp is real disk on
          # GitHub-hosted runners.
          TMPDIR: ${{ runner.temp }}/cargo-mutants-tmp
          DIFF_PATCH: ${{ runner.temp }}/diff.patch
          MUTANTS_OUT: ${{ runner.temp }}/mutants-out-${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"

          git diff "${BASE_SHA}...HEAD" > "$DIFF_PATCH"

          cargo mutants \
            --in-diff "$DIFF_PATCH" \
            -j 2 \
            --timeout-multiplier 6 \
            --shard "${SHARD}/${SHARDS}" \
            -o "$MUTANTS_OUT" \
            -- -- --include-ignored

      - name: On failure - what to do about a surviving mutant
        if: failure() && steps.run.outcome == 'failure'
        run: |
          cat <<'EOF'
          One or more mutants survived (see MISSED entries above).

          For each survivor:
            - add a test that kills it, or
            - if it is genuinely equivalent or impractical to kill, document
              it in .cargo/mutants.toml's exclude_re with a justification
              (see docs/designs/mutation-testing.md, "Equivalence policy").
              An exclusion is a reviewed code change on this PR, not a
              silent skip.
          EOF

  # The single fixed-name job branch protection should mark required.
  # mutate's own check names are matrix-derived (mutate (0), mutate (1), ...)
  # and vary with the shard count, so nothing about mutate's name is stable
  # enough to point branch protection at. scope alone doesn't say whether a
  # mutant survived. This job needs: [scope, mutate] with if: always() (so it
  # still runs even though mutate is skipped or failed — the default
  # skip-on-failed-dependency behaviour would otherwise skip this job too,
  # which is exactly the "no status reported" failure mode being avoided) and
  # translates the two jobs' results into a single pass/fail.
  mutation-gate:
    needs: [scope, mutate]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check mutation-testing gate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MUTATE_RESULT: ${{ needs.mutate.result }}
        run: |
          set -euo pipefail
          echo "scope: ${SCOPE_RESULT}, mutate: ${MUTATE_RESULT}"

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::scope job did not succeed (${SCOPE_RESULT})."
            exit 1
          fi

          case "$MUTATE_RESULT" in
            success|skipped)
              # success: mutants ran and none survived.
              # skipped: the PR touched nothing in mutation-testing scope —
              # the fast path, not a failure.
              exit 0
              ;;
            *)
              echo "::error::mutate job result: ${MUTATE_RESULT}."
              exit 1
              ;;
          esac
